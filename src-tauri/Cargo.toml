[package]
name = "screenwide"
version = "0.1.0"
description = "Reliable screen and audio recording for macOS and Windows"
authors = ["overpolish"]
license = "GPL-3.0-or-later"
edition = "2021"

[patch.crates-io]
block = { path = "vendor/block-0.1.6" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "screenwide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.build-dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc"] }

[dependencies]
tauri = { version = "2", features = ["image-ico", "image-png", "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-window-state = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-clipboard-manager = "2.3.2"
image = "0.25.10"
rapidfuzz = "0.5.0"
rayon = "1.12.0"
cpal = "0.18.1"
yuv = "0.8.16"
quantette = "0.6.0"
png = "0.18.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
wgpu = "30.0.0"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "0.9.8", features = ["wgc"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-msmf", "output-threaded"] }
rdev = { git = "https://github.com/Narsil/rdev", rev = "c77b4e5456301cfa7f2226020f2a58f2f8d77c5d", features = ["serialize"] }
windows = { version = "0.62.2", features = [
  "Foundation",
  "Graphics_Imaging",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D10",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_DirectShow",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
wasapi = "0.23.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-avfoundation", "output-threaded"] }
tauri-plugin-macos-permissions = "2.3.0"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
cidre = { version = "0.19.0", default-features = false, features = ["async", "ax", "cg", "core_audio", "iio", "macos_14_2", "ns", "sc", "vn", "vt"] }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

# Screenshot encoding is tight numeric work: colour quantization and deflate.
# Unoptimized, a Retina capture takes over eleven seconds to save in a dev
# build instead of under half a second, so `tauri dev` optimizes dependencies
# and this crate's own pixel loops. Release builds are unaffected.
#
# Measured on a 3456x2234 capture: 11.8s -> 1.2s with dependencies optimized,
# -> 0.45s with this crate at opt-level 1, which costs ~0.3s per rebuild.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.screenwide]
opt-level = 1
