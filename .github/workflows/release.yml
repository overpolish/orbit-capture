name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - name: Create or find draft release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          release_id="$(gh release view "$TAG_NAME" --json databaseId --jq .databaseId 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Screenwide $TAG_NAME" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq .id)"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm release:check-version ${{ github.ref_name }}

      - name: Build and upload signed bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          tagName: ${{ github.ref_name }}
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true

  verify:
    name: Verify updater assets
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download updater manifest
        run: |
          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | select(.name == "latest.json") | .id')"
          if [ -z "$asset_id" ]; then
            echo "The draft release does not contain latest.json" >&2
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > latest.json

      - name: Verify updater platforms
        run: |
          expected_version="${RELEASE_TAG#v}"
          jq --exit-status --arg version "$expected_version" '
            def valid($platform):
              (.platforms[$platform].url | type == "string" and length > 0) and
              (.platforms[$platform].signature | type == "string" and length > 0);
            .version == $version and
            valid("darwin-aarch64") and
            valid("windows-x86_64-nsis") and
            valid("windows-aarch64-nsis")
          ' latest.json > /dev/null

      - name: Verify updater downloads
        run: |
          jq --raw-output '
            .platforms[
              "darwin-aarch64",
              "windows-x86_64-nsis",
              "windows-aarch64-nsis"
            ].url
          ' latest.json | while IFS= read -r url; do
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              --range 0-0 "$url" > /dev/null
          done
