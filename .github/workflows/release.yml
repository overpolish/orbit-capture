name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - name: Create or find draft release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          release_id="$(gh release view "$TAG_NAME" --json databaseId --jq .databaseId 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Screenwide $TAG_NAME" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq .id)"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            args: --bundles dmg
          - name: macOS Intel
            os: macos-15-intel
            args: --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Intel FFmpeg build tools
        if: matrix.name == 'macOS Intel'
        run: brew install nasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm release:check-version ${{ github.ref_name }}

      - name: Build and upload signed bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          tagName: ${{ github.ref_name }}
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
